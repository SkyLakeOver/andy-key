<!-- Шаблон: Сотрудники -->
<div class="reference-page" x-data="employeesPage()">
    <div class="page-header">
        <h2>Справочник сотрудников</h2>
        <button @click="showAddModal = true" class="btn btn-primary">
            <span>+ Добавить сотрудника</span>
        </button>
    </div>

    <!-- Фильтры и поиск -->
    <div class="filters-bar">
        <input type="text" x-model="searchQuery" placeholder="Поиск по ФИО..." class="input-search">
        <select x-model="filterAddress" class="input-select">
            <option value="">Все адреса</option>
            <template x-for="addr in addresses" :key="addr.id">
                <option :value="addr.id" x-text="addr.fullAddress"></option>
            </template>
        </select>
    </div>

    <!-- Таблица данных -->
    <div class="data-table-container">
        <table class="data-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>ФИО полностью</th>
                    <th>ФИО кратко</th>
                    <th>Городской телефон</th>
                    <th>Внутренний телефон</th>
                    <th>Адрес</th>
                    <th>Действия</th>
                </tr>
            </thead>
            <tbody>
                <template x-for="employee in filteredEmployees" :key="employee.id">
                    <tr>
                        <td x-text="employee.id"></td>
                        <td x-text="employee.full_name"></td>
                        <td x-text="employee.short_name || '-'"></td>
                        <td x-text="employee.phone_city || '-'"></td>
                        <td x-text="employee.phone_internal || '-'"></td>
                        <td x-text="employee.address"></td>
                        <td class="actions-cell">
                            <button @click="editEmployee(employee)" class="btn-icon" title="Редактировать">✏️</button>
                            <button @click="deleteEmployee(employee.id)" class="btn-icon btn-danger" title="Удалить">🗑️</button>
                        </td>
                    </tr>
                </template>
                <tr x-show="filteredEmployees.length === 0">
                    <td colspan="7" class="empty-state">Нет данных для отображения</td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Модальное окно добавления/редактирования -->
    <div x-show="showAddModal || showEditModal" 
         class="modal-overlay"
         style="display: none;"
         @click.self="closeModal()">
        <div class="modal-content">
            <h3 x-text="showEditModal ? 'Редактирование сотрудника' : 'Новый сотрудник'"></h3>
            
            <form @submit.prevent="saveEmployee()">
                <div class="form-group">
                    <label>ФИО полностью *</label>
                    <input type="text" x-model="formData.full_name" required class="input-field">
                </div>
                
                <div class="form-group">
                    <label>ФИО кратко</label>
                    <input type="text" x-model="formData.short_name" class="input-field">
                </div>
                
                <div class="form-row" style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    <div class="form-group">
                        <label>Городской телефон</label>
                        <input type="text" x-model="formData.phone_city" class="input-field">
                    </div>
                    
                    <div class="form-group">
                        <label>Внутренний телефон</label>
                        <input type="text" x-model="formData.phone_internal" class="input-field">
                    </div>
                </div>
                
                <div class="form-group">
                    <label>Адрес *</label>
                    <select x-model="formData.address_id" required class="input-select">
                        <option value="">Выберите адрес</option>
                        <template x-for="addr in addresses" :key="addr.id">
                            <option :value="addr.id" x-text="addr.fullAddress"></option>
                        </template>
                    </select>
                </div>
                
                <div class="modal-actions">
                    <button type="button" @click="closeModal()" class="btn btn-secondary">Отмена</button>
                    <button type="submit" class="btn btn-primary">Сохранить</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
function employeesPage() {
    return {
        searchQuery: '',
        filterAddress: '',
        showAddModal: false,
        showEditModal: false,
        employees: [],
        addresses: [],
        formData: {
            id: null,
            full_name: '',
            short_name: '',
            phone_city: '',
            phone_internal: '',
            address_id: ''
        },
        
        init() {
            this.loadAddresses();
            this.loadEmployees();
        },
        
        get filteredEmployees() {
            return this.employees.filter(emp => {
                const matchesSearch = emp.full_name.toLowerCase().includes(this.searchQuery.toLowerCase()) ||
                                     (emp.short_name && emp.short_name.toLowerCase().includes(this.searchQuery.toLowerCase()));
                const matchesAddress = !this.filterAddress || emp.address_id == this.filterAddress;
                return matchesSearch && matchesAddress;
            });
        },
        
        loadAddresses() {
            fetch('/api/references/addresses')
                .then(res => res.json())
                .then(data => {
                    this.addresses = data.map(addr => ({
                        id: addr.id,
                        fullAddress: this.formatFullAddress(addr)
                    }));
                })
                .catch(err => console.error('Ошибка загрузки адресов:', err));
        },
        
        loadEmployees() {
            fetch('/api/references/employees')
                .then(res => res.json())
                .then(data => {
                    this.employees = data;
                })
                .catch(err => console.error('Ошибка загрузки сотрудников:', err));
        },
        
        formatFullAddress(addr) {
            let parts = [];
            if (addr.street) parts.push(addr.street);
            if (addr.building) parts.push(addr.building);
            if (addr.cabinet) parts.push(`каб.${addr.cabinet}`);
            else if (addr.corridor) parts.push(`кор.${addr.corridor}${addr.floor ? ' эт.' + addr.floor : ''}`);
            else if (addr.service_room) parts.push(addr.service_room);
            return parts.join(', ');
        },
        
        editEmployee(employee) {
            this.formData = {
                id: employee.id,
                full_name: employee.full_name,
                short_name: employee.short_name || '',
                phone_city: employee.phone_city || '',
                phone_internal: employee.phone_internal || '',
                address_id: employee.address_id
            };
            this.showEditModal = true;
        },
        
        saveEmployee() {
            const url = this.showEditModal ? '/api/references/employees/' + this.formData.id : '/api/references/employees';
            const method = this.showEditModal ? 'PUT' : 'POST';
            
            fetch(url, {
                method: method,
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(this.formData)
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    this.loadEmployees();
                    this.closeModal();
                } else {
                    alert('Ошибка: ' + data.error);
                }
            })
            .catch(err => alert('Ошибка сохранения: ' + err));
        },
        
        deleteEmployee(id) {
            if (confirm('Вы уверены, что хотите удалить этого сотрудника?')) {
                fetch('/api/references/employees/' + id, {method: 'DELETE'})
                    .then(res => res.json())
                    .then(data => {
                        if (data.success) this.loadEmployees();
                        else alert('Ошибка: ' + data.error);
                    })
                    .catch(err => alert('Ошибка удаления: ' + err));
            }
        },
        
        closeModal() {
            this.showAddModal = false;
            this.showEditModal = false;
            this.formData = {id: null, full_name: '', short_name: '', phone_city: '', phone_internal: '', address_id: ''};
        }
    }
}
</script>
