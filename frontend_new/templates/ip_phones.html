<!-- Шаблон: IP телефоны -->
<div class="reference-page" x-data="ipPhonesPage()">
    <div class="page-header">
        <h2>IP телефоны</h2>
        <button @click="showAddModal = true" class="btn btn-primary">
            <span>+ Добавить телефон</span>
        </button>
    </div>

    <!-- Фильтры и поиск -->
    <div class="filters-bar">
        <input type="text" x-model="searchQuery" placeholder="Поиск по ФИО или IP..." class="input-search">
        <select x-model="filterAddress" class="input-select">
            <option value="">Все адреса</option>
            <template x-for="addr in addresses" :key="addr.id">
                <option :value="addr.id" x-text="addr.fullAddress"></option>
            </template>
        </select>
    </div>

    <!-- Таблица данных -->
    <div class="data-table-container">
        <table class="data-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>ФИО сотрудника</th>
                    <th>IP адрес</th>
                    <th>Адрес</th>
                    <th>Действия</th>
                </tr>
            </thead>
            <tbody>
                <template x-for="phone in filteredPhones" :key="phone.id">
                    <tr>
                        <td x-text="phone.id"></td>
                        <td x-text="phone.employee_full_name"></td>
                        <td x-text="phone.ip"></td>
                        <td x-text="phone.address"></td>
                        <td class="actions-cell">
                            <button @click="editPhone(phone)" class="btn-icon" title="Редактировать">✏️</button>
                            <button @click="deletePhone(phone.id)" class="btn-icon btn-danger" title="Удалить">🗑️</button>
                        </td>
                    </tr>
                </template>
                <tr x-show="filteredPhones.length === 0">
                    <td colspan="5" class="empty-state">Нет данных для отображения</td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Модальное окно добавления/редактирования -->
    <div x-show="showAddModal || showEditModal" 
         class="modal-overlay"
         style="display: none;"
         @click.self="closeModal()">
        <div class="modal-content">
            <h3 x-text="showEditModal ? 'Редактирование телефона' : 'Новый IP телефон'"></h3>
            
            <form @submit.prevent="savePhone()">
                <div class="form-group">
                    <label>Адрес *</label>
                    <select x-model="formData.address_id" required class="input-select">
                        <option value="">Выберите адрес</option>
                        <template x-for="addr in addresses" :key="addr.id">
                            <option :value="addr.id" x-text="addr.fullAddress"></option>
                        </template>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>ФИО сотрудника *</label>
                    <input type="text" x-model="formData.employee_full_name" required class="input-field">
                </div>
                
                <div class="form-group">
                    <label>IP адрес *</label>
                    <input type="text" x-model="formData.ip" required pattern="([0-9]{1,3}\.){3}[0-9]{1,3}" class="input-field" placeholder="192.168.1.1">
                </div>
                
                <div class="modal-actions">
                    <button type="button" @click="closeModal()" class="btn btn-secondary">Отмена</button>
                    <button type="submit" class="btn btn-primary">Сохранить</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
function ipPhonesPage() {
    return {
        searchQuery: '',
        filterAddress: '',
        showAddModal: false,
        showEditModal: false,
        phones: [],
        addresses: [],
        formData: {
            id: null,
            address_id: '',
            employee_full_name: '',
            ip: ''
        },
        
        init() {
            this.loadAddresses();
            this.loadPhones();
        },
        
        get filteredPhones() {
            return this.phones.filter(phone => {
                const matchesSearch = phone.employee_full_name.toLowerCase().includes(this.searchQuery.toLowerCase()) ||
                                     phone.ip.includes(this.searchQuery);
                const matchesAddress = !this.filterAddress || phone.address_id == this.filterAddress;
                return matchesSearch && matchesAddress;
            });
        },
        
        loadAddresses() {
            fetch('/api/references/addresses')
                .then(res => res.json())
                .then(data => {
                    this.addresses = data.map(addr => ({
                        id: addr.id,
                        fullAddress: this.formatFullAddress(addr)
                    }));
                })
                .catch(err => console.error('Ошибка загрузки адресов:', err));
        },
        
        loadPhones() {
            fetch('/api/references/ip-phones')
                .then(res => res.json())
                .then(data => {
                    this.phones = data;
                })
                .catch(err => console.error('Ошибка загрузки телефонов:', err));
        },
        
        formatFullAddress(addr) {
            let parts = [];
            if (addr.street) parts.push(addr.street);
            if (addr.building) parts.push(addr.building);
            if (addr.cabinet) parts.push(`каб.${addr.cabinet}`);
            else if (addr.corridor) parts.push(`кор.${addr.corridor}${addr.floor ? ' эт.' + addr.floor : ''}`);
            else if (addr.service_room) parts.push(addr.service_room);
            return parts.join(', ');
        },
        
        editPhone(phone) {
            this.formData = {
                id: phone.id,
                address_id: phone.address_id,
                employee_full_name: phone.employee_full_name,
                ip: phone.ip
            };
            this.showEditModal = true;
        },
        
        savePhone() {
            const url = this.showEditModal ? '/api/references/ip-phones/' + this.formData.id : '/api/references/ip-phones';
            const method = this.showEditModal ? 'PUT' : 'POST';
            
            fetch(url, {
                method: method,
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(this.formData)
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    this.loadPhones();
                    this.closeModal();
                } else {
                    alert('Ошибка: ' + data.error);
                }
            })
            .catch(err => alert('Ошибка сохранения: ' + err));
        },
        
        deletePhone(id) {
            if (confirm('Вы уверены, что хотите удалить этот телефон?')) {
                fetch('/api/references/ip-phones/' + id, {method: 'DELETE'})
                    .then(res => res.json())
                    .then(data => {
                        if (data.success) this.loadPhones();
                        else alert('Ошибка: ' + data.error);
                    })
                    .catch(err => alert('Ошибка удаления: ' + err));
            }
        },
        
        closeModal() {
            this.showAddModal = false;
            this.showEditModal = false;
            this.formData = {id: null, address_id: '', employee_full_name: '', ip: ''};
        }
    }
}
</script>
