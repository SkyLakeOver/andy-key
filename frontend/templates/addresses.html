<!-- Шаблон: Адреса -->
<div class="reference-page" x-data="addressesPage()">
    <div class="page-header">
        <h2>Справочник адресов</h2>
        <button @click="showAddModal = true" class="btn btn-primary">
            <span>+ Добавить адрес</span>
        </button>
    </div>

    <!-- Фильтры и поиск -->
    <div class="filters-bar">
        <input type="text" x-model="searchQuery" placeholder="Поиск по адресу..." class="input-search">
        <select x-model="filterType" class="input-select">
            <option value="">Все типы</option>
            <option value="cabinet">Кабинет</option>
            <option value="corridor">Коридор</option>
            <option value="service">Служебное помещение</option>
        </select>
    </div>

    <!-- Таблица данных -->
    <div class="data-table-container">
        <table class="data-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Улица</th>
                    <th>Дом</th>
                    <th>Тип</th>
                    <th>Значение</th>
                    <th>Этаж</th>
                    <th>Полный адрес</th>
                    <th>Действия</th>
                </tr>
            </thead>
            <tbody>
                <template x-for="address in filteredAddresses" :key="address.id">
                    <tr>
                        <td x-text="address.id"></td>
                        <td x-text="address.street"></td>
                        <td x-text="address.building"></td>
                        <td>
                            <span class="badge" 
                                  :class="{
                                      'badge-cabinet': address.type === 'cabinet',
                                      'badge-corridor': address.type === 'corridor',
                                      'badge-service': address.type === 'service'
                                  }"
                                  x-text="address.typeLabel"></span>
                        </td>
                        <td x-text="address.value"></td>
                        <td x-text="address.floor || '-'"></td>
                        <td x-text="address.fullAddress"></td>
                        <td class="actions-cell">
                            <button @click="editAddress(address)" class="btn-icon" title="Редактировать">✏️</button>
                            <button @click="deleteAddress(address.id)" class="btn-icon btn-danger" title="Удалить">🗑️</button>
                        </td>
                    </tr>
                </template>
                <tr x-show="filteredAddresses.length === 0">
                    <td colspan="8" class="empty-state">Нет данных для отображения</td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Модальное окно добавления/редактирования -->
    <div x-show="showAddModal || showEditModal" 
         class="modal-overlay"
         style="display: none;"
         @click.self="closeModal()">
        <div class="modal-content">
            <h3 x-text="showEditModal ? 'Редактирование адреса' : 'Новый адрес'"></h3>
            
            <form @submit.prevent="saveAddress()">
                <div class="form-group">
                    <label>Улица *</label>
                    <input type="text" x-model="formData.street" required class="input-field">
                </div>
                
                <div class="form-group">
                    <label>Дом *</label>
                    <input type="text" x-model="formData.building" required class="input-field">
                </div>
                
                <div class="form-group">
                    <label>Тип адреса *</label>
                    <select x-model="formData.addressType" @change="onAddressTypeChange()" class="input-select" required>
                        <option value="">Выберите тип</option>
                        <option value="cabinet">Кабинет</option>
                        <option value="corridor">Коридор</option>
                        <option value="service">Служебное помещение</option>
                    </select>
                </div>
                
                <div class="form-group" x-show="formData.addressType === 'cabinet'">
                    <label>Кабинет</label>
                    <input type="text" x-model="formData.cabinet" class="input-field">
                </div>
                
                <div class="form-group" x-show="formData.addressType === 'corridor'">
                    <label>Коридор</label>
                    <input type="text" x-model="formData.corridor" class="input-field">
                    <label>Этаж (1-5) *</label>
                    <input type="number" x-model="formData.floor" min="1" max="5" class="input-field">
                </div>
                
                <div class="form-group" x-show="formData.addressType === 'service'">
                    <label>Служебное помещение</label>
                    <select x-model="formData.serviceRoom" class="input-select">
                        <option value="">Выберите помещение</option>
                        <option value="server">Серверная</option>
                        <option value="storage">Склад</option>
                        <option value="office">Офис</option>
                        <option value="garage">Гараж</option>
                        <option value="other">Другое</option>
                    </select>
                </div>
                
                <div class="form-group" x-show="formData.serviceRoom === 'garage'">
                    <label>Описание гаража</label>
                    <input type="text" x-model="formData.description" class="input-field" placeholder="Например: Гараж №12, бокс А-5">
                </div>
                
                <div class="form-group" x-show="formData.serviceRoom !== '' && formData.serviceRoom !== 'garage'">
                    <label>Описание помещения</label>
                    <input type="text" x-model="formData.description" class="input-field" placeholder="Описание служебного помещения">
                </div>
                
                <div class="modal-actions">
                    <button type="button" @click="closeModal()" class="btn btn-secondary">Отмена</button>
                    <button type="submit" class="btn btn-primary">Сохранить</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
function addressesPage() {
    return {
        searchQuery: '',
        filterType: '',
        showAddModal: false,
        showEditModal: false,
        addresses: [],
        formData: {
            id: null,
            street: '',
            building: '',
            addressType: '',
            cabinet: '',
            corridor: '',
            floor: null,
            serviceRoom: '',
            garage: ''
        },
        
        init() {
            this.loadAddresses();
        },
        
        get filteredAddresses() {
            return this.addresses.filter(addr => {
                const matchesSearch = addr.fullAddress.toLowerCase().includes(this.searchQuery.toLowerCase()) ||
                                     addr.street.toLowerCase().includes(this.searchQuery.toLowerCase());
                const matchesType = !this.filterType || addr.type === this.filterType;
                return matchesSearch && matchesType;
            });
        },
        
        loadAddresses() {
            fetch('/api/reference/addresses')
                .then(res => res.json())
                .then(data => {
                    this.addresses = data.map(addr => ({
                        ...addr,
                        type: addr.cabinet ? 'cabinet' : addr.corridor ? 'corridor' : 'service',
                        typeLabel: addr.cabinet ? 'Кабинет' : addr.corridor ? 'Коридор' : 'Служебное',
                        value: addr.cabinet || addr.corridor || addr.service_room,
                        fullAddress: addr.full_address || this.formatFullAddress(addr)
                    }));
                })
                .catch(err => console.error('Ошибка загрузки адресов:', err));
        },
        
        formatFullAddress(addr) {
            let parts = [];
            if (addr.street) parts.push(addr.street);
            if (addr.building) parts.push(addr.building);
            if (addr.cabinet) parts.push(`каб.${addr.cabinet}`);
            else if (addr.corridor) parts.push(`кор.${addr.corridor}${addr.floor ? ' эт.' + addr.floor : ''}`);
            else if (addr.service_room) parts.push(addr.service_room);
            return parts.join(', ');
        },
        
        onAddressTypeChange() {
            this.formData.cabinet = '';
            this.formData.corridor = '';
            this.formData.floor = null;
            this.formData.serviceRoom = '';
            this.formData.garage = '';
        },
        
        editAddress(address) {
            // Определяем тип и подтип из сохраненных данных
            let addrType = address.type || 'service';
            let serviceVal = address.value || '';
            
            // Если в БД записан гараж как service_room='garage', то ставим тип service и serviceRoom='garage'
            if (serviceVal === 'garage' || address.service_room === 'garage') {
                addrType = 'service';
                serviceVal = 'garage';
            }
            
            this.formData = {
                id: address.id,
                street: address.street,
                building: address.building,
                addressType: addrType,
                cabinet: addrType === 'cabinet' ? serviceVal : '',
                corridor: addrType === 'corridor' ? serviceVal : '',
                floor: address.floor,
                serviceRoom: addrType === 'service' ? serviceVal : '',
                garage: serviceVal === 'garage' ? (address.garage_number || serviceVal) : ''
            };
            this.showEditModal = true;
        },
        
        saveAddress() {
            const url = this.showEditModal ? '/api/reference/addresses/' + this.formData.id : '/api/reference/addresses';
            const method = this.showEditModal ? 'PUT' : 'POST';
            
            // Формируем данные для отправки в соответствии с AddressRequest
            const payload = {
                street: this.formData.street,
                building: this.formData.building,
                cabinet: this.formData.addressType === 'cabinet' ? this.formData.cabinet : '',
                corridor: this.formData.addressType === 'corridor' ? this.formData.corridor : '',
                service_room: this.formData.addressType === 'service' ? this.formData.serviceRoom : '',
                garage_number: this.formData.serviceRoom === 'garage' ? this.formData.garage : '',
                floor: this.formData.floor || ''
            };
            
            fetch(url, {
                method: method,
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            })
            .then(async res => {
                const data = await res.json();
                if (!res.ok) {
                    throw new Error(data.error || 'Ошибка сохранения');
                }
                return data;
            })
            .then(data => {
                if (data.success) {
                    this.loadAddresses();
                    this.closeModal();
                } else {
                    alert('Ошибка: ' + data.error);
                }
            })
            .catch(err => {
                console.error('Ошибка сохранения адреса:', err);
                alert('Ошибка сохранения: ' + err.message);
            });
        },
        
        deleteAddress(id) {
            if (confirm('Вы уверены, что хотите удалить этот адрес?')) {
                fetch('/api/reference/addresses/' + id, {method: 'DELETE'})
                    .then(res => res.json())
                    .then(data => {
                        if (data.success) this.loadAddresses();
                        else alert('Ошибка: ' + data.error);
                    })
                    .catch(err => alert('Ошибка удаления: ' + err));
            }
        },
        
        closeModal() {
            this.showAddModal = false;
            this.showEditModal = false;
            this.formData = {id: null, street: '', building: '', addressType: '', cabinet: '', corridor: '', floor: null, serviceRoom: '', garage: ''};
        }
    }
}
</script>
