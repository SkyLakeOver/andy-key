<!-- Шаблон: Сетевые МФУ -->
<div class="reference-page" x-data="networkMfpsPage()">
    <div class="page-header">
        <h2>Сетевые МФУ</h2>
        <button @click="showAddModal = true" class="btn btn-primary">
            <span>+ Добавить МФУ</span>
        </button>
    </div>

    <!-- Фильтры и поиск -->
    <div class="filters-bar">
        <input type="text" x-model="searchQuery" placeholder="Поиск по модели или IP..." class="input-search">
        <select x-model="filterAddress" class="input-select">
            <option value="">Все адреса</option>
            <template x-for="addr in addresses" :key="addr.id">
                <option :value="addr.id" x-text="addr.fullAddress"></option>
            </template>
        </select>
    </div>

    <!-- Таблица данных -->
    <div class="data-table-container">
        <table class="data-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Модель</th>
                    <th>IP адрес</th>
                    <th>Имя хоста</th>
                    <th>Серийный номер</th>
                    <th>Адрес</th>
                    <th>Действия</th>
                </tr>
            </thead>
            <tbody>
                <template x-for="mfp in filteredMfps" :key="mfp.id">
                    <tr>
                        <td x-text="mfp.id"></td>
                        <td x-text="mfp.model"></td>
                        <td x-text="mfp.ip"></td>
                        <td x-text="mfp.hostname || '-'"></td>
                        <td x-text="mfp.serial_number"></td>
                        <td x-text="mfp.address"></td>
                        <td class="actions-cell">
                            <button @click="editMfp(mfp)" class="btn-icon" title="Редактировать">✏️</button>
                            <button @click="deleteMfp(mfp.id)" class="btn-icon btn-danger" title="Удалить">🗑️</button>
                        </td>
                    </tr>
                </template>
                <tr x-show="filteredMfps.length === 0">
                    <td colspan="7" class="empty-state">Нет данных для отображения</td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Модальное окно добавления/редактирования -->
    <div x-show="showAddModal || showEditModal" 
         class="modal-overlay"
         style="display: none;"
         @click.self="closeModal()">
        <div class="modal-content">
            <h3 x-text="showEditModal ? 'Редактирование МФУ' : 'Новое сетевое МФУ'"></h3>
            
            <form @submit.prevent="saveMfp()">
                <div class="form-group">
                    <label>Адрес *</label>
                    <select x-model="formData.address_id" required class="input-select">
                        <option value="">Выберите адрес</option>
                        <template x-for="addr in addresses" :key="addr.id">
                            <option :value="addr.id" x-text="addr.fullAddress"></option>
                        </template>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>Модель *</label>
                    <input type="text" x-model="formData.model" required class="input-field">
                </div>
                
                <div class="form-group">
                    <label>IP адрес *</label>
                    <input type="text" x-model="formData.ip" required pattern="([0-9]{1,3}\.){3}[0-9]{1,3}" class="input-field" placeholder="192.168.1.1">
                </div>
                
                <div class="form-group">
                    <label>Имя хоста</label>
                    <input type="text" x-model="formData.hostname" class="input-field">
                </div>
                
                <div class="form-group">
                    <label>Серийный номер *</label>
                    <input type="text" x-model="formData.serial_number" required class="input-field">
                </div>
                
                <div class="modal-actions">
                    <button type="button" @click="closeModal()" class="btn btn-secondary">Отмена</button>
                    <button type="submit" class="btn btn-primary">Сохранить</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
function networkMfpsPage() {
    return {
        searchQuery: '',
        filterAddress: '',
        showAddModal: false,
        showEditModal: false,
        mfps: [],
        addresses: [],
        formData: {
            id: null,
            address_id: '',
            model: '',
            ip: '',
            hostname: '',
            serial_number: ''
        },
        
        init() {
            this.loadAddresses();
            this.loadMfps();
        },
        
        get filteredMfps() {
            return this.mfps.filter(mfp => {
                const matchesSearch = mfp.model.toLowerCase().includes(this.searchQuery.toLowerCase()) ||
                                     mfp.ip.includes(this.searchQuery) ||
                                     (mfp.hostname && mfp.hostname.toLowerCase().includes(this.searchQuery.toLowerCase()));
                const matchesAddress = !this.filterAddress || mfp.address_id == this.filterAddress;
                return matchesSearch && matchesAddress;
            });
        },
        
        loadAddresses() {
            fetch('/api/references/addresses')
                .then(res => res.json())
                .then(data => {
                    this.addresses = data.map(addr => ({
                        id: addr.id,
                        fullAddress: this.formatFullAddress(addr)
                    }));
                })
                .catch(err => console.error('Ошибка загрузки адресов:', err));
        },
        
        loadMfps() {
            fetch('/api/references/network-mfps')
                .then(res => res.json())
                .then(data => {
                    this.mfps = data;
                })
                .catch(err => console.error('Ошибка загрузки МФУ:', err));
        },
        
        formatFullAddress(addr) {
            let parts = [];
            if (addr.street) parts.push(addr.street);
            if (addr.building) parts.push(addr.building);
            if (addr.cabinet) parts.push(`каб.${addr.cabinet}`);
            else if (addr.corridor) parts.push(`кор.${addr.corridor}${addr.floor ? ' эт.' + addr.floor : ''}`);
            else if (addr.service_room) parts.push(addr.service_room);
            return parts.join(', ');
        },
        
        editMfp(mfp) {
            this.formData = {
                id: mfp.id,
                address_id: mfp.address_id,
                model: mfp.model,
                ip: mfp.ip,
                hostname: mfp.hostname || '',
                serial_number: mfp.serial_number
            };
            this.showEditModal = true;
        },
        
        saveMfp() {
            const url = this.showEditModal ? '/api/references/network-mfps/' + this.formData.id : '/api/references/network-mfps';
            const method = this.showEditModal ? 'PUT' : 'POST';
            
            fetch(url, {
                method: method,
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(this.formData)
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    this.loadMfps();
                    this.closeModal();
                } else {
                    alert('Ошибка: ' + data.error);
                }
            })
            .catch(err => alert('Ошибка сохранения: ' + err));
        },
        
        deleteMfp(id) {
            if (confirm('Вы уверены, что хотите удалить это МФУ?')) {
                fetch('/api/references/network-mfps/' + id, {method: 'DELETE'})
                    .then(res => res.json())
                    .then(data => {
                        if (data.success) this.loadMfps();
                        else alert('Ошибка: ' + data.error);
                    })
                    .catch(err => alert('Ошибка удаления: ' + err));
            }
        },
        
        closeModal() {
            this.showAddModal = false;
            this.showEditModal = false;
            this.formData = {id: null, address_id: '', model: '', ip: '', hostname: '', serial_number: ''};
        }
    }
}
</script>
