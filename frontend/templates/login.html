<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>andy-key - Вход</title>
    
    <!-- Стили -->
    <link rel="stylesheet" href="/static/css/main.css">
    
    <style>
        [x-cloak] { display: none !important; }
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .login-container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
        }
        
        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .login-header h1 {
            color: #333;
            margin: 0 0 10px 0;
            font-size: 28px;
        }
        
        .login-header p {
            color: #666;
            margin: 0;
            font-size: 14px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .login-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        
        .login-btn:active {
            transform: translateY(0);
        }
        
        .error-message {
            background: #fee;
            color: #c00;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }
        
        .footer-text {
            text-align: center;
            margin-top: 20px;
            color: #999;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="login-container" x-data="loginForm()">
        <div class="login-header">
            <h1>andy-key</h1>
            <p>Платформа автоматизации</p>
        </div>
        
        <div class="error-message" x-show="error" x-text="error"></div>
        
        <form @submit.prevent="submitLogin()">
            <div class="form-group">
                <label for="username">Имя пользователя</label>
                <input type="text" id="username" x-model="username" required autocomplete="username" placeholder="Введите имя пользователя">
            </div>
            
            <div class="form-group">
                <label for="password">Пароль</label>
                <input type="password" id="password" x-model="password" required autocomplete="current-password" placeholder="Введите пароль">
            </div>
            
            <button type="submit" class="login-btn" :disabled="loading">
                <span x-show="!loading">Войти</span>
                <span x-show="loading" x-cloak>Вход...</span>
            </button>
        </form>
        
        <div class="footer-text" x-text="footerText"></div>
    </div>
    
    <!-- Alpine.js для реактивности -->
    <script defer src="/static/js/alpine.min.js"></script>
    
    <script>
    document.addEventListener('alpine:init', () => {
        Alpine.data('loginForm', () => ({
            username: '',
            password: '',
            error: '',
            loading: false,
            footerText: '{{.FooterText}}',
            
            submitLogin() {
                this.loading = true;
                this.error = '';
                
                fetch('/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    credentials: 'same-origin',
                    body: JSON.stringify({
                        username: this.username,
                        password: this.password
                    })
                })
                .then(res => res.json())
                .then(data => {
                    if (data.redirect) {
                        window.location.href = data.redirect;
                    } else {
                        this.error = data.error || 'Неверное имя пользователя или пароль';
                    }
                })
                .catch(err => {
                    this.error = 'Ошибка подключения к серверу';
                    console.error('Ошибка входа:', err);
                })
                .finally(() => {
                    this.loading = false;
                });
            }
        }));
    });
    </script>
</body>
</html>
