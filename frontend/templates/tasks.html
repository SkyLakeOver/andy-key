<!-- Шаблон: Задачи (Администрирование) -->
<div class="admin-page" x-data="tasksPage()">
    <div class="page-header">
        <h2>Управление задачами</h2>
        <button @click="showAddModal = true" class="btn btn-primary">
            <span>+ Создать задачу</span>
        </button>
    </div>

    <!-- Фильтры и поиск -->
    <div class="filters-bar">
        <input type="text" x-model="searchQuery" placeholder="Поиск по названию..." class="input-search">
        <select x-model="filterStatus" class="input-select">
            <option value="">Все статусы</option>
            <option value="pending">Ожидает</option>
            <option value="running">Выполняется</option>
            <option value="completed">Завершена</option>
            <option value="failed">Ошибка</option>
        </select>
    </div>

    <!-- Таблица данных -->
    <div class="data-table-container">
        <table class="data-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Название</th>
                    <th>Скрипт</th>
                    <th>Хосты</th>
                    <th>Статус</th>
                    <th>Создана</th>
                    <th>Начата</th>
                    <th>Завершена</th>
                    <th>Действия</th>
                </tr>
            </thead>
            <tbody>
                <template x-for="task in filteredTasks" :key="task.id">
                    <tr>
                        <td x-text="task.id"></td>
                        <td x-text="task.name"></td>
                        <td x-text="task.script_name || '-'"></td>
                        <td x-text="task.hosts_count"></td>
                        <td>
                            <span class="badge" 
                                  :class="{
                                      'badge-warning': task.status === 'pending',
                                      'badge-info': task.status === 'running',
                                      'badge-success': task.status === 'completed',
                                      'badge-danger': task.status === 'failed'
                                  }"
                                  x-text="task.statusLabel"></span>
                        </td>
                        <td x-text="task.created_at"></td>
                        <td x-text="task.started_at || '-'"></td>
                        <td x-text="task.completed_at || '-'"></td>
                        <td class="actions-cell">
                            <button @click="viewTask(task)" class="btn-icon" title="Просмотр">👁️</button>
                            <button @click="startTask(task.id)" :disabled="task.status !== 'pending'" class="btn-icon" title="Запустить">▶️</button>
                            <button @click="stopTask(task.id)" :disabled="task.status !== 'running'" class="btn-icon" title="Остановить">⏹️</button>
                            <button @click="deleteTask(task.id)" class="btn-icon btn-danger" title="Удалить">🗑️</button>
                        </td>
                    </tr>
                </template>
                <tr x-show="filteredTasks.length === 0">
                    <td colspan="9" class="empty-state">Нет задач для отображения</td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Модальное окно создания задачи -->
    <div x-show="showAddModal" 
         class="modal-overlay"
         style="display: none;"
         @click.self="closeModal()">
        <div class="modal-content">
            <h3>Новая задача</h3>
            
            <form @submit.prevent="saveTask()">
                <div class="form-group">
                    <label>Название *</label>
                    <input type="text" x-model="formData.name" required class="input-field">
                </div>
                
                <div class="form-group">
                    <label>Скрипт *</label>
                    <select x-model="formData.script_id" required class="input-select">
                        <option value="">Выберите скрипт</option>
                        <template x-for="script in scripts" :key="script.id">
                            <option :value="script.id" x-text="script.name"></option>
                        </template>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>Хосты</label>
                    <textarea x-model="formData.hosts" rows="4" class="input-field" placeholder="IP адреса через запятую"></textarea>
                </div>
                
                <div class="modal-actions">
                    <button type="button" @click="closeModal()" class="btn btn-secondary">Отмена</button>
                    <button type="submit" class="btn btn-primary">Создать</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
function tasksPage() {
    return {
        searchQuery: '',
        filterStatus: '',
        showAddModal: false,
        tasks: [],
        scripts: [],
        formData: {
            name: '',
            script_id: '',
            hosts: ''
        },
        
        init() {
            this.loadScripts();
            this.loadTasks();
        },
        
        get filteredTasks() {
            return this.tasks.filter(task => {
                const matchesSearch = task.name.toLowerCase().includes(this.searchQuery.toLowerCase());
                const matchesStatus = !this.filterStatus || task.status === this.filterStatus;
                return matchesSearch && matchesStatus;
            });
        },
        
        loadScripts() {
            fetch('/api/admin/scripts')
                .then(res => res.json())
                .then(data => {
                    this.scripts = data;
                })
                .catch(err => console.error('Ошибка загрузки скриптов:', err));
        },
        
        loadTasks() {
            fetch('/api/admin/tasks')
                .then(res => res.json())
                .then(data => {
                    this.tasks = data.map(task => ({
                        ...task,
                        statusLabel: this.getStatusLabel(task.status)
                    }));
                })
                .catch(err => console.error('Ошибка загрузки задач:', err));
        },
        
        getStatusLabel(status) {
            const labels = {
                'pending': 'Ожидает',
                'running': 'Выполняется',
                'completed': 'Завершена',
                'failed': 'Ошибка'
            };
            return labels[status] || status;
        },
        
        viewTask(task) {
            alert('Просмотр задачи: ' + task.name);
        },
        
        startTask(id) {
            if (confirm('Запустить задачу?')) {
                fetch('/api/admin/tasks/' + id + '/start', {method: 'POST'})
                    .then(res => res.json())
                    .then(data => {
                        if (data.success) this.loadTasks();
                        else alert('Ошибка: ' + data.error);
                    })
                    .catch(err => alert('Ошибка запуска: ' + err));
            }
        },
        
        stopTask(id) {
            if (confirm('Остановить задачу?')) {
                fetch('/api/admin/tasks/' + id + '/stop', {method: 'POST'})
                    .then(res => res.json())
                    .then(data => {
                        if (data.success) this.loadTasks();
                        else alert('Ошибка: ' + data.error);
                    })
                    .catch(err => alert('Ошибка остановки: ' + err));
            }
        },
        
        saveTask() {
            fetch('/api/admin/tasks', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(this.formData)
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    this.loadTasks();
                    this.closeModal();
                } else {
                    alert('Ошибка: ' + data.error);
                }
            })
            .catch(err => alert('Ошибка сохранения: ' + err));
        },
        
        deleteTask(id) {
            if (confirm('Вы уверены, что хотите удалить эту задачу?')) {
                fetch('/api/admin/tasks/' + id, {method: 'DELETE'})
                    .then(res => res.json())
                    .then(data => {
                        if (data.success) this.loadTasks();
                        else alert('Ошибка: ' + data.error);
                    })
                    .catch(err => alert('Ошибка удаления: ' + err));
            }
        },
        
        closeModal() {
            this.showAddModal = false;
            this.formData = {name: '', script_id: '', hosts: ''};
        }
    }
}
</script>
