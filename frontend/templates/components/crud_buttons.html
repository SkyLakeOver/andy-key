{{define "components/crud_buttons"}}
<div class="flex space-x-2">
    {{if .ViewURL}}
    <a href="{{.ViewURL}}" class="inline-flex items-center px-3 py-1.5 border border-gray-300 shadow-sm text-sm font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50">
        Просмотр
    </a>
    {{end}}
    {{if .EditURL}}
    <a href="{{.EditURL}}" class="inline-flex items-center px-3 py-1.5 border border-transparent text-sm font-medium rounded-md text-white bg-blue-600 hover:bg-blue-700">
        Изменить
    </a>
    {{end}}
    {{if .DeleteURL}}
    <button type="button" hx-delete="{{.DeleteURL}}" hx-confirm="Вы уверены? Это действие нельзя отменить." hx-target="closest tr" hx-swap="outerHTML swap:1s" class="inline-flex items-center px-3 py-1.5 border border-transparent text-sm font-medium rounded-md text-white bg-red-600 hover:bg-red-700">
        Удалить
    </button>
    {{end}}
</div>
{{end}}
