{{define "components/input"}}
<div class="form-group" x-data="{ error: '{{.Error}}' }">
    <label for="{{.Name}}" class="block text-sm font-medium text-gray-700">
        {{.Label}} {{if .Required}}<span class="text-red-500">*</span>{{end}}
    </label>
    <input 
        type="{{.Type | default "text"}}" 
        id="{{.Name}}" 
        name="{{.Name}}" 
        value="{{.Value}}" 
        {{if .Required}}required{{end}}
        {{if .ReadOnly}}readonly{{end}} 
        {{if .Disabled}}disabled{{end}}
        {{if .Placeholder}}placeholder="{{.Placeholder}}"{{end}}
        {{if .HXGet}}hx-get="{{.HXGet}}" hx-trigger="keyup changed delay:500ms" hx-target="#{{.Name}}-error"{{end}}
        class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm {{if .Error}}border-red-500{{end}}"
    >
    {{if .Error}}
        <p id="{{.Name}}-error" class="mt-1 text-sm text-red-600">{{.Error}}</p>
    {{else if .HXGet}}
        <p id="{{.Name}}-error" class="mt-1 text-sm text-red-600" x-show="error" x-text="error"></p>
    {{end}}
</div>
{{end}}
