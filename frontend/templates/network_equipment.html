<!-- Шаблон: Сетевое оборудование -->
<div class="reference-page" x-data="networkEquipmentPage()">
    <div class="page-header">
        <h2>Сетевое оборудование</h2>
        <button @click="showAddModal = true" class="btn btn-primary">
            <span>+ Добавить оборудование</span>
        </button>
    </div>

    <!-- Фильтры и поиск -->
    <div class="filters-bar">
        <input type="text" x-model="searchQuery" placeholder="Поиск по модели..." class="input-search">
        <select x-model="filterCategory" class="input-select">
            <option value="">Все категории</option>
            <option value="switch">Коммутаторы</option>
            <option value="router">Маршрутизаторы</option>
            <option value="firewall">Межсетевые экраны</option>
            <option value="other">Другое</option>
        </select>
        <select x-model="filterAddress" class="input-select">
            <option value="">Все адреса</option>
            <template x-for="addr in addresses" :key="addr.id">
                <option :value="addr.id" x-text="addr.fullAddress"></option>
            </template>
        </select>
    </div>

    <!-- Таблица данных -->
    <div class="data-table-container">
        <table class="data-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Категория</th>
                    <th>Тип</th>
                    <th>Модель</th>
                    <th>Количество портов</th>
                    <th>Адрес</th>
                    <th>Действия</th>
                </tr>
            </thead>
            <tbody>
                <template x-for="equip in filteredEquipment" :key="equip.id">
                    <tr>
                        <td x-text="equip.id"></td>
                        <td x-text="equip.category_label"></td>
                        <td x-text="equip.type"></td>
                        <td x-text="equip.model"></td>
                        <td x-text="equip.port_count"></td>
                        <td x-text="equip.address"></td>
                        <td class="actions-cell">
                            <button @click="editEquipment(equip)" class="btn-icon" title="Редактировать">✏️</button>
                            <button @click="deleteEquipment(equip.id)" class="btn-icon btn-danger" title="Удалить">🗑️</button>
                        </td>
                    </tr>
                </template>
                <tr x-show="filteredEquipment.length === 0">
                    <td colspan="7" class="empty-state">Нет данных для отображения</td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Модальное окно добавления/редактирования -->
    <div x-show="showAddModal || showEditModal" 
         class="modal-overlay"
         style="display: none;"
         @click.self="closeModal()">
        <div class="modal-content">
            <h3 x-text="showEditModal ? 'Редактирование оборудования' : 'Новое сетевое оборудование'"></h3>
            
            <form @submit.prevent="saveEquipment()">
                <div class="form-group">
                    <label>Адрес *</label>
                    <select x-model="formData.address_id" required class="input-select">
                        <option value="">Выберите адрес</option>
                        <template x-for="addr in addresses" :key="addr.id">
                            <option :value="addr.id" x-text="addr.fullAddress"></option>
                        </template>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>Категория *</label>
                    <select x-model="formData.category" required class="input-select">
                        <option value="">Выберите категорию</option>
                        <option value="switch">Коммутаторы</option>
                        <option value="router">Маршрутизаторы</option>
                        <option value="firewall">Межсетевые экраны</option>
                        <option value="other">Другое</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>Тип *</label>
                    <input type="text" x-model="formData.type" required class="input-field" placeholder="Например: L2 Managed">
                </div>
                
                <div class="form-group">
                    <label>Модель *</label>
                    <input type="text" x-model="formData.model" required class="input-field">
                </div>
                
                <div class="form-group">
                    <label>Количество портов *</label>
                    <input type="number" x-model="formData.port_count" min="1" required class="input-field">
                </div>
                
                <div class="modal-actions">
                    <button type="button" @click="closeModal()" class="btn btn-secondary">Отмена</button>
                    <button type="submit" class="btn btn-primary">Сохранить</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
function networkEquipmentPage() {
    return {
        searchQuery: '',
        filterCategory: '',
        filterAddress: '',
        showAddModal: false,
        showEditModal: false,
        equipment: [],
        addresses: [],
        formData: {
            id: null,
            address_id: '',
            category: '',
            type: '',
            model: '',
            port_count: 1
        },
        
        init() {
            this.loadAddresses();
            this.loadEquipment();
        },
        
        get filteredEquipment() {
            return this.equipment.filter(eq => {
                const matchesSearch = eq.model.toLowerCase().includes(this.searchQuery.toLowerCase()) ||
                                     eq.type.toLowerCase().includes(this.searchQuery.toLowerCase());
                const matchesCategory = !this.filterCategory || eq.category === this.filterCategory;
                const matchesAddress = !this.filterAddress || eq.address_id == this.filterAddress;
                return matchesSearch && matchesCategory && matchesAddress;
            });
        },
        
        loadAddresses() {
            fetch('/api/references/addresses')
                .then(res => res.json())
                .then(data => {
                    this.addresses = data.map(addr => ({
                        id: addr.id,
                        fullAddress: this.formatFullAddress(addr)
                    }));
                })
                .catch(err => console.error('Ошибка загрузки адресов:', err));
        },
        
        loadEquipment() {
            fetch('/api/references/network-equipment')
                .then(res => res.json())
                .then(data => {
                    this.equipment = data.map(eq => ({
                        ...eq,
                        category_label: this.getCategoryLabel(eq.category)
                    }));
                })
                .catch(err => console.error('Ошибка загрузки оборудования:', err));
        },
        
        formatFullAddress(addr) {
            let parts = [];
            if (addr.street) parts.push(addr.street);
            if (addr.building) parts.push(addr.building);
            if (addr.cabinet) parts.push(`каб.${addr.cabinet}`);
            else if (addr.corridor) parts.push(`кор.${addr.corridor}${addr.floor ? ' эт.' + addr.floor : ''}`);
            else if (addr.service_room) parts.push(addr.service_room);
            return parts.join(', ');
        },
        
        getCategoryLabel(cat) {
            const labels = {
                'switch': 'Коммутаторы',
                'router': 'Маршрутизаторы',
                'firewall': 'Межсетевые экраны',
                'other': 'Другое'
            };
            return labels[cat] || cat;
        },
        
        editEquipment(equip) {
            this.formData = {
                id: equip.id,
                address_id: equip.address_id,
                category: equip.category,
                type: equip.type,
                model: equip.model,
                port_count: equip.port_count
            };
            this.showEditModal = true;
        },
        
        saveEquipment() {
            const url = this.showEditModal ? '/api/references/network-equipment/' + this.formData.id : '/api/references/network-equipment';
            const method = this.showEditModal ? 'PUT' : 'POST';
            
            fetch(url, {
                method: method,
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(this.formData)
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    this.loadEquipment();
                    this.closeModal();
                } else {
                    alert('Ошибка: ' + data.error);
                }
            })
            .catch(err => alert('Ошибка сохранения: ' + err));
        },
        
        deleteEquipment(id) {
            if (confirm('Вы уверены, что хотите удалить это оборудование?')) {
                fetch('/api/references/network-equipment/' + id, {method: 'DELETE'})
                    .then(res => res.json())
                    .then(data => {
                        if (data.success) this.loadEquipment();
                        else alert('Ошибка: ' + data.error);
                    })
                    .catch(err => alert('Ошибка удаления: ' + err));
            }
        },
        
        closeModal() {
            this.showAddModal = false;
            this.showEditModal = false;
            this.formData = {id: null, address_id: '', category: '', type: '', model: '', port_count: 1};
        }
    }
}
</script>
