<!-- Шаблон: Хосты -->
<div class="reference-page" x-data="hostsPage()">
    <div class="page-header">
        <h2>Справочник хостов</h2>
        <button @click="showAddModal = true" class="btn btn-primary">
            <span>+ Добавить хост</span>
        </button>
    </div>

    <!-- Фильтры и поиск -->
    <div class="filters-bar">
        <input type="text" x-model="searchQuery" placeholder="Поиск по IP или имени..." class="input-search">
        <select x-model="filterEnabled" class="input-select">
            <option value="">Все</option>
            <option value="true">Активные</option>
            <option value="false">Неактивные</option>
        </select>
        <select x-model="filterAddress" class="input-select">
            <option value="">Все адреса</option>
            <template x-for="addr in addresses" :key="addr.id">
                <option :value="addr.id" x-text="addr.fullAddress"></option>
            </template>
        </select>
    </div>

    <!-- Таблица данных -->
    <div class="data-table-container">
        <table class="data-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>IP адрес</th>
                    <th>SSH порт</th>
                    <th>Адрес</th>
                    <th>Сотрудник</th>
                    <th>Статус</th>
                    <th>Действия</th>
                </tr>
            </thead>
            <tbody>
                <template x-for="host in filteredHosts" :key="host.id">
                    <tr>
                        <td x-text="host.id"></td>
                        <td x-text="host.ip"></td>
                        <td x-text="host.ssh_port || '22'"></td>
                        <td x-text="host.address"></td>
                        <td x-text="host.employee || '-'"></td>
                        <td>
                            <span class="badge" 
                                  :class="host.enabled ? 'badge-success' : 'badge-danger'"
                                  x-text="host.enabled ? 'Активен' : 'Неактивен'"></span>
                        </td>
                        <td class="actions-cell">
                            <button @click="editHost(host)" class="btn-icon" title="Редактировать">✏️</button>
                            <button @click="deleteHost(host.id)" class="btn-icon btn-danger" title="Удалить">🗑️</button>
                        </td>
                    </tr>
                </template>
                <tr x-show="filteredHosts.length === 0">
                    <td colspan="7" class="empty-state">Нет данных для отображения</td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Модальное окно добавления/редактирования -->
    <div x-show="showAddModal || showEditModal" 
         class="modal-overlay"
         style="display: none;"
         @click.self="closeModal()">
        <div class="modal-content">
            <h3 x-text="showEditModal ? 'Редактирование хоста' : 'Новый хост'"></h3>
            
            <form @submit.prevent="saveHost()">
                <div class="form-group">
                    <label>IP адрес *</label>
                    <input type="text" x-model="formData.ip" required pattern="([0-9]{1,3}\.){3}[0-9]{1,3}" class="input-field" placeholder="192.168.1.1">
                </div>
                
                <div class="form-group">
                    <label>SSH порт</label>
                    <input type="number" x-model="formData.ssh_port" value="22" class="input-field">
                </div>
                
                <div class="form-group">
                    <label>Адрес *</label>
                    <select x-model="formData.address_id" required class="input-select">
                        <option value="">Выберите адрес</option>
                        <template x-for="addr in addresses" :key="addr.id">
                            <option :value="addr.id" x-text="addr.fullAddress"></option>
                        </template>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>Сотрудник</label>
                    <select x-model="formData.employee_id" class="input-select">
                        <option value="">Не назначен</option>
                        <template x-for="emp in employees" :key="emp.id">
                            <option :value="emp.id" x-text="emp.full_name"></option>
                        </template>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>
                        <input type="checkbox" x-model="formData.enabled" style="margin-right: 8px;">
                        Хост активен
                    </label>
                </div>
                
                <div class="modal-actions">
                    <button type="button" @click="closeModal()" class="btn btn-secondary">Отмена</button>
                    <button type="submit" class="btn btn-primary">Сохранить</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
function hostsPage() {
    return {
        searchQuery: '',
        filterEnabled: '',
        filterAddress: '',
        showAddModal: false,
        showEditModal: false,
        hosts: [],
        addresses: [],
        employees: [],
        formData: {
            id: null,
            ip: '',
            ssh_port: 22,
            address_id: '',
            employee_id: '',
            enabled: true
        },
        
        init() {
            this.loadAddresses();
            this.loadEmployees();
            this.loadHosts();
        },
        
        get filteredHosts() {
            return this.hosts.filter(host => {
                const matchesSearch = host.ip.includes(this.searchQuery);
                const matchesEnabled = this.filterEnabled === '' || String(host.enabled) === this.filterEnabled;
                const matchesAddress = !this.filterAddress || host.address_id == this.filterAddress;
                return matchesSearch && matchesEnabled && matchesAddress;
            });
        },
        
        loadAddresses() {
            fetch('/api/references/addresses')
                .then(res => res.json())
                .then(data => {
                    this.addresses = data.map(addr => ({
                        id: addr.id,
                        fullAddress: this.formatFullAddress(addr)
                    }));
                })
                .catch(err => console.error('Ошибка загрузки адресов:', err));
        },
        
        loadEmployees() {
            fetch('/api/references/employees')
                .then(res => res.json())
                .then(data => {
                    this.employees = data;
                })
                .catch(err => console.error('Ошибка загрузки сотрудников:', err));
        },
        
        loadHosts() {
            fetch('/api/references/hosts')
                .then(res => res.json())
                .then(data => {
                    this.hosts = data;
                })
                .catch(err => console.error('Ошибка загрузки хостов:', err));
        },
        
        formatFullAddress(addr) {
            let parts = [];
            if (addr.street) parts.push(addr.street);
            if (addr.building) parts.push(addr.building);
            if (addr.cabinet) parts.push(`каб.${addr.cabinet}`);
            else if (addr.corridor) parts.push(`кор.${addr.corridor}${addr.floor ? ' эт.' + addr.floor : ''}`);
            else if (addr.service_room) parts.push(addr.service_room);
            return parts.join(', ');
        },
        
        editHost(host) {
            this.formData = {
                id: host.id,
                ip: host.ip,
                ssh_port: host.ssh_port || 22,
                address_id: host.address_id,
                employee_id: host.employee_id || '',
                enabled: host.enabled
            };
            this.showEditModal = true;
        },
        
        saveHost() {
            const url = this.showEditModal ? '/api/references/hosts/' + this.formData.id : '/api/references/hosts';
            const method = this.showEditModal ? 'PUT' : 'POST';
            
            fetch(url, {
                method: method,
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(this.formData)
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    this.loadHosts();
                    this.closeModal();
                } else {
                    alert('Ошибка: ' + data.error);
                }
            })
            .catch(err => alert('Ошибка сохранения: ' + err));
        },
        
        deleteHost(id) {
            if (confirm('Вы уверены, что хотите удалить этот хост?')) {
                fetch('/api/references/hosts/' + id, {method: 'DELETE'})
                    .then(res => res.json())
                    .then(data => {
                        if (data.success) this.loadHosts();
                        else alert('Ошибка: ' + data.error);
                    })
                    .catch(err => alert('Ошибка удаления: ' + err));
            }
        },
        
        closeModal() {
            this.showAddModal = false;
            this.showEditModal = false;
            this.formData = {id: null, ip: '', ssh_port: 22, address_id: '', employee_id: '', enabled: true};
        }
    }
}
</script>
